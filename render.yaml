services:
  - type: web
    name: silogtran-liquidaciones-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT app.main:app"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SILOGTRAN_BASE_URL
        value: https://construproyec.colombiasoftware.net
      - key: SILOGTRAN_LOGIN_URL
        value: https://construproyec.colombiasoftware.net/index.php?page=Login
      - key: SILOGTRAN_REPORT_URL
        value: https://construproyec.colombiasoftware.net/index.php?page=Despacho.Liquidacionmanifiesto.InformeGeneral_111
      - key: SILOGTRAN_COST_CENTER
        value: CONSTRUPROYEC-PRINCIPAL
      - key: SILOGTRAN_USERNAME
        sync: false
      - key: SILOGTRAN_PASSWORD
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: MAX_CACHE_ENTRIES
        value: "500"
      - key: MAX_DATE_RANGE_DAYS
        value: "366"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: LOG_LEVEL
        value: INFO
